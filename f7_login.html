<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="Author" content="Vrishti" />
    <meta name="Description" content="Create Login Form" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
        <style>
           @import url('https://fonts.googleapis.com/css2?family=Courgette&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
           *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           }
           body {
            min-height: 100dvh;
            background-color: #314158;
            font-family: "courgette", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
           }
           section {
            background-color: azure;
            width: 20rem;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 5px 10px rgb(212, 212, 224);
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
           }
           input {
            height: 40px;
            padding: 2px 10px;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            border: none;
            border-radius: 8px;
            background-color: rgb(42, 42, 90);
           }
           button[type="submit"] {
            background-color: rgb(108, 108, 131);
            color: white;
            padding: 10px 100px;
            font-size: 15px;
            font-weight: 600;
            font-family: courgette;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px 2px rgb(48, 48, 82);
           }
    </style>
</head>
<body>
    <section>
        <main>
            <form action="#" method="get">
                <h2 style="text-align: center">Login</h2>
                <br />
                <label for="email">Email</label><br />
                <input
                type="text"
                id="email"
                name="email"
                placeholder="Enter Your email"
                minlength="3"
                maxlength="8"
                required/>
                <br>
                <label for="password">Password</label><br />
                <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Your password"
                minlength="3"
                maxlength="8"
                required
            />
            <br /><br />
                <button type="Submit">Submit</button>
            </form>
        </main>
    </section>
</body>
</html>
